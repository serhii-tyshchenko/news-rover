<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#282c34">
  <meta name="description" content="NewsRover is a news aggregator app that allows users to followm various news sources.">
  <link rel="manifest" href="/site.webmanifest" />
  <title>NewsRover</title>
  <script>
    // Keep in sync with STORAGE_KEY_REDUX_STATE and useTheme
    (function () {
      let theme = 'system';
      try {
        const state = JSON.parse(localStorage.getItem('news-rover:redux-state:v1'));
        theme = (state && state.settings && state.settings.theme) || 'system';
      } catch (e) { }
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root" class="flex flex-col h-dvh max-w-[1920px] mx-auto"></div>
  <div id="portal-root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
